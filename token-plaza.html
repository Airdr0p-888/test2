    <!-- 顶部导航 -->

    <main class="tp-main">

      <!-- 页面标题 -->
      <div class="tp-header">
        <div class="tp-header-glow"></div>
        <h1 class="tp-title">
          <span class="tp-title-icon">₿</span>
          <span>代币广场</span>
        </h1>
        <p class="tp-subtitle">基于 Ave.ai 实时数据 · BSC 链上代币追踪</p>
        <div class="tp-status-bar">
          <div class="tp-status-item">

      <!-- 搜索栏 -->

          <div class="tp-stat-val" id="statTotal">--</div>

        </div>
        <div class="tp-stat-card">
          <div class="tp-stat-icon">💰</div>
          <div class="tp-stat-val" id="statPrice">--</div>

        </div>
        <div class="tp-stat-card">
          <div class="tp-stat-icon">📊</div>
          <div class="tp-stat-val" id="statMcap">--</div>
          <div class="tp-stat-label">市值</div>
        </div>
        <div class="tp-stat-card">
          <div class="tp-stat-icon">👥</div>
          <div class="tp-stat-val" id="statHolders">--</div>
          <div class="tp-stat-label">持币者</div>
        </div>
      </div>

      <!-- 代币列表 -->
      <div class="tp-list" id="tokenList">
        <!-- JS 动态渲染 -->
        <div class="tp-loading" id="loadingState">
          <div class="tp-spinner"></div>
          <span>正在从 Ave.ai 加载实时数据...</span>
        </div>
      </div>

      <!-- 空状态 -->
      <div class="tp-empty" id="tpEmpty" style="display:none;">
        <div class="tp-empty-icon">₿</div>
        <h3>未找到代币</h3>
        <p>该合约地址在 BSC 链上未找到匹配的代币，请检查地址是否正确。</p>
      </div>

      <!-- 错误状态 -->
      <div class="tp-error" id="tpError" style="display:none;">
        <div class="tp-error-icon">⚠️</div>
        <h3>数据加载失败</h3>
        <p id="errorMsg">无法连接到 Ave.ai API，请稍后重试。</p>
        <button class="tp-retry-btn" onclick="loadDefaultToken()">🔄 重试</button>
      </div>

    </main>

    <!-- 代币详情弹窗 -->
    <div class="tp-modal-overlay" id="tpModal" style="display:none;">
      <div class="tp-modal">
        <button class="tp-modal-close" onclick="closeTokenModal()">✕</button>
        <div class="tp-modal-header" id="tpModalHeader"></div>
        <div class="tp-modal-body" id="tpModalBody"></div>
        <div class="tp-modal-footer">
          <a id="modalAveLink" href="#" target="_blank" class="tp-modal-link" style="display:none;">🔗 查看 Ave.ai 详情</a>
          <button class="tp-modal-btn" onclick="closeTokenModal()">关闭</button>
        </div>
      </div>
    </div>

    <script>
      // ── Ave.ai 配置 ──
      const AVE_API_KEY = "mwQOPupoqBczQqJVJUyVWMZKV7WVVXwQ2lm60as8dRLCIhm64MJe06gCZD4Kva1L";
      const AVE_BASE_URL = "https://prod.ave-api.com/v2";
      const DEFAULT_CONTRACT = "0xE628bdB19c744f2225d2D18f78f050265e600000";
      const DEFAULT_CHAIN = "bsc";

      // ── 预埋真实数据（Ave.ai API 返回，解决浏览器 CORS 跨域限制）──
      // 数据来源：Ave.ai v2 /tokens 接口，最后更新时间：2026-06-30
      const FALLBACK_TOKEN_DATA = [{
        total: "137500000000000000",
        launch_price: "0",
        current_price_eth: "0",
        current_price_usd: "0",
        price_change_1d: "0",
        lock_amount: "0",
        burn_amount: "0",
        other_amount: "0",
        tx_volume_u_24h: "0",
        locked_percent: "0",
        market_cap: "0",
        fdv: "0",
        risk_score: "55",
        token: "0xe628bdb19c744f2225d2d18f78f050265e600000",
        chain: "bsc",
        decimal: 18,
        name: "\u6740\u96f6\u62f3\u5934",
        symbol: "\u6740\u96f6\u62f3\u5934",
        holders: 1,
        logo_url: "",
        created_at: 1782795369,
        updated_at: 1782795371,
        main_pair: "0x8da43dc582bbd975d6d85902513119b4dc768e4f"
      }];

      // 预埋详情数据（含 pairs、风险报告等）
      const FALLBACK_DETAIL_DATA = {
        token: FALLBACK_TOKEN_DATA[0],
        is_audited: false,
        pairs: [{
          reserve0: "0", reserve1: "0",
          token0_price_eth: "1", token0_price_usd: "552.94147",
          token1_price_eth: "0", token1_price_usd: "0",
          price_change: "0", price_change_1d: "0", price_change_1h: "",
          volume_u: "0", low_u: "0", high_u: "0",
          fee: "", total_supply: "", tx_amount: "",
          pair: "0x8da43dc582bbd975d6d85902513119b4dc768e4f",
          chain: "bsc", amm: "cakev2",
          token0_address: "0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c",
          token0_symbol: "WBNB", token0_decimal: 18,
          token1_address: "0xe628bdb19c744f2225d2d18f78f050265e600000",
          token1_symbol: "\u6740\u96f6\u62f3\u5934", token1_decimal: 18,
          target_token: "0xe628bdb19c744f2225d2d18f78f050265e600000",
          price_change_1d: "0",
          created_at: 1782795369, tx_count: 0, updated_at: 1782795369,
          market_cap: "0", fdv: "0", is_fake: false
        }]
      };

      // ── 当前数据 ──
      let currentTokens = [];
      let currentFilter = "all";

      // ── 工具函数：格式化数字 ──
      function formatNumber(num, decimals = 0) {
        const n = parseFloat(num);
        if (!n && n !== 0) return "--";
        if (n === 0) return "0";
        if (n >= 1e9) return (n / 1e9).toFixed(2) + " B";
        if (n >= 1e6) return (n / 1e6).toFixed(2) + " M";
        if (n >= 1e3) return n.toLocaleString("en-US", { maximumFractionDigits: decimals });
        if (n < 0.01 && n > 0) return "< 0.01";
        return n.toFixed(decimals);
      }

      function formatSupply(rawSupply, decimal = 18) {
        const divisor = Math.pow(10, decimal);
        const num = parseFloat(rawSupply) / divisor;
        if (!num && num !== 0) return "--";
        if (num === 0) return "0";
        if (num >= 1e9) return (num / 1e9).toFixed(2) + " B";
        if (num >= 1e6) return (num / 1e6).toFixed(2) + " M";
        if (num >= 1e3) return num.toLocaleString("en-US", { maximumFractionDigits: 2 });
        // 小数显示完整精度，去掉末尾多余的 0
        return parseFloat(num.toFixed(8)).toString();
      }

      function formatDate(timestamp) {
        if (!timestamp) return "--";
        return new Date(timestamp * 1000).toLocaleDateString("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        });
      }

      function shortenAddr(addr) {
        if (!addr || addr.length <= 12) return addr || "--";
        return addr.slice(0, 6) + "..." + addr.slice(-4);
      }

      function bscscanLink(addr) {
        return `https://bscscan.com/token/${addr}`;
      }

      function aveLink(addr) {
        return `https://ave.ai/token/${addr}-bsc`;
      }

      // ── 状态颜色 ──
      function getStatusClass(tokenData) {
        // 根据是否有交易量和价格来判断是否已上线
        const price = parseFloat(tokenData.current_price_usd);
        const volume = parseFloat(tokenData.tx_volume_u_24h);
        const holders = parseInt(tokenData.holders);

        if (holders > 10 && (price > 0 || volume > 0)) return "launched";
        return "minting";
      }

      function getStatusLabel(tokenData) {
        const cls = getStatusClass(tokenData);
        return cls === "launched" ? "✅ 已上线" : "🔥 Mint中";
      }

      // ── 调用 Ave.ai API ──
      async function fetchTokenByContract(address) {
        try {
          const resp = await fetch(
            `${AVE_BASE_URL}/tokens?keyword=${address}&chain=${DEFAULT_CHAIN}`,
            {
              headers: {
                "X-API-KEY": AVE_API_KEY,
                "Content-Type": "application/json"
              }
            }
          );
          const json = await resp.json();
          if (json.status === 1 && json.data && json.data.length > 0) {
            return json.data; // 返回数组
          }
          return [];
        } catch (err) {
          console.error("Ave API Error:", err);
          throw err;
        }
      }

      async function fetchTokenDetail(address) {
        try {
          const resp = await fetch(
            `${AVE_BASE_URL}/tokens/${address.toLowerCase()}-${DEFAULT_CHAIN}`,
            {
              headers: {
                "X-API-KEY": AVE_API_KEY,
                "Content-Type": "application/json"
              }
            }
          );
          const json = await resp.json();
          if (json.status === 1 && json.data) {
            return json.data; // 返回完整对象 {token, pairs, is_audited}
          }
          return null;
        } catch (err) {
          console.error("Ave Detail Error:", err);
          return null;
        }
      }

      // ── 渲染代币卡片 ──
      function renderCard(t) {
        const status = getStatusClass(t);
        const statusLabel = getStatusLabel(t);
        const supply = formatSupply(t.total, t.decimal || 18);
        const price = parseFloat(t.current_price_usd) > 0 ? `$${formatNumber(t.current_price_usd, 8)}` : "暂无报价";
        const mcap = parseFloat(t.market_cap) > 0 ? `$${formatNumber(t.market_cap)}` : "暂无";
        const volume = parseFloat(t.tx_volume_u_24h) > 0 ? `$${formatNumber(t.tx_volume_u_24h)}` : "--";

        // 用名称前两个字做头像
        const avatarText = t.symbol && t.symbol.length >= 2 ? t.symbol.slice(0, 2) : (t.name ? t.name.slice(0, 2) : "?");

        const mintUrl = `./mint.html?contract=${t.token}`;

        return `
          <div class="tp-card ${status}" data-contract="${t.token}" onclick="window.location.href='${mintUrl}'" style="cursor:pointer;">
            <div class="tp-card-badge ${status}">${statusLabel}</div>
            <div class="tp-card-header">
              <img src="./touxiao.png" class="tp-card-avatar-img-show" alt="${t.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
              <div class="tp-card-avatar" style="display:none;">${avatarText}</div>
              <div class="tp-card-info">
                <h3>${t.name || "Unknown"}</h3>
                <span class="tp-card-symbol">${t.symbol || ""}</span>
              </div>
            </div>
            <div class="tp-card-stats">
              <div class="tp-card-stat">
                <span class="tp-cs-label">价格 (USD)</span>
                <span class="tp-cs-val tp-price-val">${price}</span>
              </div>
              <div class="tp-card-stat">
                <span class="tp-cs-label">市值</span>
                <span class="tp-cs-val">${mcap}</span>
              </div>
              <div class="tp-card-stat">
                <span class="tp-cs-label">总供应量</span>
                <span class="tp-cs-val">${supply}</span>
              </div>
              <div class="tp-card-stat">
                <span class="tp-cs-label">24h 交易量</span>
                <span class="tp-cs-val">${volume}</span>
              </div>
              <div class="tp-card-stat">
                <span class="tp-cs-label">持币者</span>
                <span class="tp-cs-val">${t.holders != null ? t.holders.toLocaleString() : "--"} 人</span>
              </div>
              <div class="tp-card-stat">
                <span class="tp-cs-label">创建时间</span>
                <span class="tp-cs-val">${formatDate(t.created_at)}</span>
              </div>
            </div>
            <div class="tp-card-actions">
              <a href="${mintUrl}" class="tp-card-btn tp-btn-detail" onclick="event.stopPropagation();">🥊 进入 Mint →</a>
              <a href="${bscscanLink(t.token)}" target="_blank" class="tp-card-btn tp-btn-bsc" title="BscScan" onclick="event.stopPropagation();">🔗</a>
              <a href="${aveLink(t.token)}" target="_blank" class="tp-card-btn tp-btn-ave" title="Ave.ai" onclick="event.stopPropagation();">Ave</a>
            </div>
          </div>
        `;
      }

      function renderList() {
        const list = document.getElementById("tokenList");
        const empty = document.getElementById("tpEmpty");

        list.innerHTML = "";

        if (currentTokens.length === 0) {
          empty.style.display = "flex";
          document.getElementById("tpError").style.display = "none";
          return;
        }

        empty.style.display = "none";
        document.getElementById("tpError").style.display = "none";
        list.innerHTML = currentTokens.map(renderCard).join("");

        updateStats();
      }

      // ── 更新统计 ──
      function updateStats() {
        document.getElementById("statTotal").textContent = currentTokens.length;
        document.getElementById("totalTokenCount").textContent = currentTokens.length + " 个代币";

        if (currentTokens.length === 1) {
          const t = currentTokens[0];
          document.getElementById("statPrice").textContent =
            parseFloat(t.current_price_usd) > 0 ? "$" + formatNumber(t.current_price_usd, 8) : "--";
          document.getElementById("statMcap").textContent =
            parseFloat(t.market_cap) > 0 ? "$" + formatNumber(t.market_cap) : "--";
          document.getElementById("statHolders").textContent =
            t.holders != null ? t.holders : "--";
        } else {
          const totalHolders = currentTokens.reduce((sum, t) => sum + (parseInt(t.holders) || 0), 0);
          const totalMcap = currentTokens.reduce((sum, t) => sum + (parseFloat(t.market_cap) || 0), 0);
          document.getElementById("statPrice").textContent = "--";
          document.getElementById("statMcap").textContent =
            totalMcap > 0 ? "$" + formatNumber(totalMcap) : "--";
          document.getElementById("statHolders").textContent = totalHolders;
        }
      }

      // ── 弹窗详情 ──
      async function openTokenModal(address) {
        const t = currentTokens.find(x => x.token === address);
        if (!t) return;

        // 尝试获取详情（含 pairs 信息），失败则用预埋数据
        let detail = null;
        try { detail = await fetchTokenDetail(address); } catch (e) { /* CORS 等 */ }
        if (!detail) detail = FALLBACK_DETAIL_DATA;

        const status = getStatusClass(t);
        const statusLabel = getStatusLabel(t);
        const supply = formatSupply(t.total, t.decimal || 18);
        const price = parseFloat(t.current_price_usd) > 0 ? "$" + formatNumber(t.current_price_usd, 8) : "暂无报价";
        const mcap = parseFloat(t.market_cap) > 0 ? "$" + formatNumber(t.market_cap) : "暂无";
        const fdv = parseFloat(t.fdv) > 0 ? "$" + formatNumber(t.fdv) : "暂无";
        const volume24h = parseFloat(t.tx_volume_u_24h) > 0 ? "$" + formatNumber(t.tx_volume_u_24h) : "--";
        const avatarText = t.symbol && t.symbol.length >= 2 ? t.symbol.slice(0, 2) : (t.name ? t.name.slice(0, 2) : "?");

        // 从详情获取交易对信息
        let pairInfo = "";
        if (detail && detail.pairs && detail.pairs.length > 0) {
          const pair = detail.pairs[0];
          const lpReserve0 = parseFloat(pair.reserve0) > 0 ? formatNumber(parseFloat(pair.reserve0)) : "0";
          const lpReserve1 = parseFloat(pair.reserve1) > 0 ? formatSupply(pair.reserve1, t.decimal || 18) : "0";
          const ammName = (pair.amm || "").toUpperCase().replace(/V\d+$/, " v" + ((pair.amm || "").match(/\d+/)?.[0] || "2"));
          pairInfo = `
            <div class="tp-mi-row">
              <span class="tp-mi-label">交易所</span>
              <span class="tp-mi-val">${ammName || "PancakeSwap"}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">交易对地址</span>
              <span class="tp-mi-val contract-addr">${shortenAddr(pair.pair)}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">流动性池</span>
              <span class="tp-mi-val">WBNB / ${t.symbol || "?"}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">池内储备</span>
              <span class="tp-mi-val">${lpReserve0} BNB / ${lpReserve1} ${t.symbol}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">24h 交易笔数</span>
              <span class="tp-mi-val">${pair.tx_count ?? "--"}</span>
            </div>
          `;
        }

        document.getElementById("tpModalHeader").innerHTML = `
          <img src="./touxiao.png" class="tp-modal-avatar-img-show" alt="${t.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
          <div class="tp-modal-avatar" style="display:none;">${avatarText}</div>
          <div>
            <h2>${t.name} <span class="tp-modal-symbol">${t.symbol}</span></h2>
            <span class="tp-card-badge ${status}">${statusLabel}</span>
          </div>
        `;
        document.getElementById("tpModalBody").innerHTML = `
          <div class="tp-modal-info">
            <div class="tp-mi-row">
              <span class="tp-mi-label">合约地址</span>
              <span class="tp-mi-val contract-addr">${t.token}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">区块链</span>
              <span class="tp-mi-val">${t.chain?.toUpperCase() || "BSC"}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">精度 (Decimals)</span>
              <span class="tp-mi-val">${t.decimal ?? 18}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">当前价格</span>
              <span class="tp-mi-val">${price}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">总供应量</span>
              <span class="tp-mi-val">${supply}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">市值</span>
              <span class="tp-mi-val">${mcap}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">FDV</span>
              <span class="tp-mi-val">${fdv}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">24h 交易量</span>
              <span class="tp-mi-val">${volume24h}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">持币者数量</span>
              <span class="tp-mi-val">${t.holders != null ? t.holders.toLocaleString() + " 人" : "--"}</span>
            </div>
            <div class="tp-mi-row">
              <span class="tp-mi-label">创建时间</span>
              <span class="tp-mi-val">${formatDate(t.created_at)}</span>
            </div>
            ${pairInfo}
          </div>
        `;

        // 显示 Ave 链接
        const aveLinkEl = document.getElementById("modalAveLink");
        aveLinkEl.href = aveLink(t.token);
        aveLinkEl.style.display = "inline-block";

        document.getElementById("tpModal").style.display = "flex";
      }

      function closeTokenModal() {
        document.getElementById("tpModal").style.display = "none";
      }

      // ── 搜索功能 ──
      async function searchByAddress() {
        const input = document.getElementById("searchInput");
        const addr = input.value.trim();

        if (!addr) {
          await loadDefaultToken();
          return;
        }

        showLoading(`正在搜索 ${shortenAddr(addr)} ...`);

        try {
          const results = await fetchTokenByContract(addr);
          if (results.length > 0) {
            currentTokens = results;
            renderList();
          } else {
            document.getElementById("tokenList").innerHTML = "";
            document.getElementById("tpEmpty").style.display = "flex";
            document.getElementById("tpError").style.display = "none";
            updateStatsZero();
          }
        } catch (err) {
          showError(err.message);
        }
      }

      // 回车触发搜索
      document.getElementById("searchInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") searchByAddress();
      });

      // ── 加载默认代币（优先 API，失败则降级到本地预埋数据）──
      async function loadDefaultToken() {
        showLoading(`正在从 Ave.ai 加载 ${shortenAddr(DEFAULT_CONTRACT)} 数据...`);

        // 先尝试实时 API（可能因 CORS 被浏览器拦截）
        let apiOk = false;
        try {
          const results = await fetchTokenByContract(DEFAULT_CONTRACT);
          if (results.length > 0) {
            currentTokens = results;
            apiOk = true;
            document.getElementById("apiStatus").textContent = "Ave.ai 实时数据";
          }
        } catch (err) {
          console.log("API 请求失败，使用预埋数据:", err.message);
        }

        // API 失败 → 使用预埋的真实数据
        if (!apiOk) {
          currentTokens = JSON.parse(JSON.stringify(FALLBACK_TOKEN_DATA));
          document.getElementById("apiStatus").textContent = "Ave.ai 缓存数据 (CORS)";
        }

        renderList();
      }

      // ── UI 状态 ──
      function showLoading(msg) {
        document.getElementById("tokenList").innerHTML = `
          <div class="tp-loading" id="loadingState">
            <div class="tp-spinner"></div>
            <span>${msg || "正在加载..."}</span>
          </div>
        `;
        document.getElementById("tpEmpty").style.display = "none";
        document.getElementById("tpError").style.display = "none";
      }

      function showError(msg) {
        document.getElementById("tokenList").innerHTML = "";
        document.getElementById("tpEmpty").style.display = "none";
        document.getElementById("tpError").style.display = "flex";
        document.getElementById("errorMsg").textContent = msg || "网络错误，请检查连接后重试。";
        updateStatsZero();
      }

      function updateStatsZero() {
        document.getElementById("statTotal").textContent = "0";
        document.getElementById("statPrice").textContent = "--";
        document.getElementById("statMcap").textContent = "--";
        document.getElementById("statHolders").textContent = "--";
        document.getElementById("totalTokenCount").textContent = "0 个代币";
      }

      // ── 背景粒子 ──
      const canvas = document.getElementById("bgCanvas");
      const ctx = canvas.getContext("2d");
      let particles = [];

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function createParticles() {
        particles = [];
        const count = Math.floor(window.innerWidth / 18);
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.8 + 0.5,
            dx: (Math.random() - 0.5) * 0.25,
            dy: (Math.random() - 0.5) * 0.25,
            alpha: Math.random() * 0.35 + 0.1,
            color: Math.random() > 0.6 ? "#ffd700" : "#ff4444"
          });
        }
      }

      function drawParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.fill();
          ctx.globalAlpha = 1;
          p.x += p.dx;
          p.y += p.dy;
          if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        });
        requestAnimationFrame(drawParticles);
      }

      window.addEventListener("resize", () => {
        resizeCanvas();
        createParticles();
      });

      resizeCanvas();
      createParticles();
      drawParticles();

      // ── 初始化：自动加载默认合约 ──
      loadDefaultToken();
    </script>
  </body>
</html>
