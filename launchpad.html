      let currentMode = MODES[0].id;

      // ─── 渲染左侧模式列表 ───
      function renderModes() {
        const el = document.getElementById("modesList");
        el.innerHTML = MODES.map(m => `
          <button class="lp-mode-item ${m.id === currentMode ? 'active' : ''}" data-mode="${m.id}" onclick="selectMode('${m.id}')">
            <span class="lp-mode-icon" style="background: ${m.color}22; border-color: ${m.color}55;">${m.icon}</span>
            <span class="lp-mode-info">
              <span class="lp-mode-name">${m.name}</span>
              <span class="lp-mode-en">${m.en}</span>
            </span>
            <span class="lp-mode-arrow">›</span>
          </button>
        `).join("");
      }

      // ─── 渲染右侧配置面板 ───
      function renderConfig() {
        const mode = MODES.find(m => m.id === currentMode);
        const el = document.getElementById("configPanel");

        const fieldsHtml = mode.fields.map(f => {
          let input = "";
          if (f.type === "text") {
            input = `<input type="text" class="lp-input" placeholder="${f.placeholder || ''}" value="${f.value || ''}" />`;
          } else if (f.type === "number") {
            input = `<input type="number" class="lp-input" placeholder="${f.placeholder || ''}" ${f.step ? `step="${f.step}"` : ''} value="${f.value || ''}" />`;
          } else if (f.type === "textarea") {
            input = `<textarea class="lp-input lp-textarea" placeholder="${f.placeholder || ''}" rows="5">${f.value || ''}</textarea>`;
          } else if (f.type === "select") {
            input = `<select class="lp-input lp-select">${f.options.map(o => `<option ${o === f.value ? 'selected' : ''}>${o}</option>`).join("")}</select>`;
          } else if (f.type === "range") {
            input = `
              <div class="lp-range-wrap">
                <input type="range" class="lp-range" min="${f.min}" max="${f.max}" step="${f.step}" value="${f.value}" oninput="this.nextElementSibling.textContent = this.value + '%'" />
                <span class="lp-range-val">${f.value}%</span>
              </div>
            `;
          } else if (f.type === "toggle") {
            input = `
              <label class="lp-toggle">
                <input type="checkbox" ${f.value ? 'checked' : ''} />
                <span class="lp-toggle-slider"></span>
              </label>
            `;
          }
          return `
            <div class="lp-field">
              <label class="lp-field-label">${f.label}</label>
              ${input}
            </div>
          `;
        }).join("");

        el.innerHTML = `
          <div class="lp-config-head">
            <div class="lp-config-icon" style="background: ${mode.color}22; border-color: ${mode.color}66;">${mode.icon}</div>
            <div class="lp-config-title-wrap">
              <h2 class="lp-config-title">${mode.name}</h2>
              <p class="lp-config-en">${mode.en}</p>
            </div>
            <div class="lp-config-tag" style="border-color: ${mode.color}66; color: ${mode.color};">MODE</div>
          </div>
          <p class="lp-config-desc">${mode.desc}</p>
          <div class="lp-fields">
            ${fieldsHtml}
          </div>
          <div class="lp-config-foot">
            <div class="lp-warn">
              <span class="lp-warn-icon">⚠️</span>
              <span>需等待官方平台币上线后可以使用，当前为预览模式，配置参数可调整预览，但不会真正部署。</span>
            </div>
            <button class="lp-launch-btn" onclick="tryLaunch('${mode.id}')">
              <span class="lp-launch-icon">🚀</span>
              <span>发射</span>
              <span class="lp-launch-glow"></span>
            </button>
          </div>
        `;
      }

      // ─── 选择模式 ───
      function selectMode(id) {
        currentMode = id;
        renderModes();
        renderConfig();
      }

      // ─── 发射（暂不执行）───
      function tryLaunch(modeId) {
        const mode = MODES.find(m => m.id === modeId);
        const desc = `「${mode.name}」模式即将开放，届时你将能够使用以上配置参数一键部署到 BSC 链上。`;
        document.getElementById("modalDesc").textContent = desc;

        // 收集当前配置
        const configEl = document.getElementById("configPanel");
        const inputs = configEl.querySelectorAll(".lp-input, .lp-range, .lp-toggle input");
        const modeFields = mode.fields;
        let configHtml = '<div class="lp-modal-config-title">当前配置预览：</div>';
        modeFields.forEach((f, i) => {
          let val = "";
          const fieldEl = configEl.querySelectorAll(".lp-field")[i];
          if (f.type === "range") {
            val = fieldEl.querySelector(".lp-range-val").textContent;
          } else if (f.type === "toggle") {
            val = fieldEl.querySelector("input[type=checkbox]").checked ? "✅ 开启" : "❌ 关闭";
          } else if (f.type === "select") {
            val = fieldEl.querySelector("select").value;
          } else {
            val = fieldEl.querySelector("input, textarea").value || "(未填写)";
          }
          configHtml += `<div class="lp-modal-config-row"><span>${f.label}</span><strong>${val}</strong></div>`;
        });
        document.getElementById("modalConfig").innerHTML = configHtml;

        document.getElementById("modalOverlay").classList.add("show");
      }

      function closeModal() {
        document.getElementById("modalOverlay").classList.remove("show");
      }

      // ─── 粒子背景 ───
      function initBg() {
        const canvas = document.getElementById("bgCanvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let w, h;
        function resize() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
        resize();
        addEventListener("resize", resize);

        const particles = [];
        for (let i = 0; i < 50; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 2 + 0.5,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
            color: Math.random() > 0.5 ? "255,58,26" : "255,215,0",
            a: Math.random() * 0.3 + 0.05,
          });
        }

        function loop() {
          ctx.clearRect(0, 0, w, h);
          particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.color},${p.a})`;
            ctx.fill();
          });
          requestAnimationFrame(loop);
        }
        loop();
      }

      // ─── 初始化 ───
      renderModes();
      renderConfig();
      initBg();
    </script>
